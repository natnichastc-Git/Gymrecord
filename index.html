<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกสุขภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<style>
:root{
  --bg:#EDF3FB; --surface:#FFFFFF; --ink:#0B1B33; --muted:#566883; --line:#D6E3F2; --field:#EDF3FB;
  --food:#0877BE; --on-food:#FFFFFF; --food-soft:#DDF0FD;
  --lift:#2748E0; --on-lift:#FFFFFF; --lift-soft:#E3E9FF;
  --ok:#0E9F86; --ok-soft:#DDF5EF; --warn:#D93A40; --warn-soft:#FDECEC; --on-warn:#FFFFFF; --good:#16A34A; --good-soft:#DCF5E5; --mid:#E5B800; --mid-soft:#FDF3C4;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surface:#111C30; --ink:#EAF1FB; --muted:#8FA3C0; --line:#223552; --field:#08111F;
    --food:#3DB4F5; --on-food:#04182A; --food-soft:#0E2A40;
    --lift:#7F9BFF; --on-lift:#0A1230; --lift-soft:#1A2A57;
    --ok:#35D0B2; --ok-soft:#10332D; --warn:#FF7378; --warn-soft:#3A1A1D; --on-warn:#2B0A0C; --good:#4ADE80; --good-soft:#12301F; --mid:#FACC15; --mid-soft:#3A3208;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#111C30; --ink:#EAF1FB; --muted:#8FA3C0; --line:#223552; --field:#08111F;
  --food:#3DB4F5; --on-food:#04182A; --food-soft:#0E2A40;
  --lift:#7F9BFF; --on-lift:#0A1230; --lift-soft:#1A2A57;
  --ok:#35D0B2; --ok-soft:#10332D; --warn:#FF7378; --warn-soft:#3A1A1D; --on-warn:#2B0A0C; --good:#4ADE80; --good-soft:#12301F; --mid:#FACC15; --mid-soft:#3A3208;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 0 8px;min-height:64px}
.hd .nav{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line);flex:none}
.hd svg{width:20px;height:20px}
.dt{flex:1;position:relative;text-align:center;line-height:1.25;padding:2px 0}
.dt .d1{display:block;font:600 20px/1.2 'Prompt','Noto Sans Thai',sans-serif}
.dt .d2{display:block;font-size:13px;color:var(--muted)}
.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dt.left{text-align:left}
.back-today{display:block;margin:0 auto 6px;font-size:13px;color:var(--lift);font-weight:500;padding:2px 10px;min-height:28px}
main.wrap{padding-bottom:132px;padding-top:6px}

/* layout helpers */
.split{display:block}
.side>*+*,.col>*+*{margin-top:12px}
.split>*+*{margin-top:12px}
.split>.meals{margin-top:20px}
.gap{height:12px}

/* ring */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 16px 8px;text-align:center}
.ring{position:relative;width:min(240px,72vw);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--food-soft)}
.ring .bar{stroke:var(--food);transition:stroke-dashoffset .5s ease,stroke .3s}
.ring.over .bar{stroke:var(--warn)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font:700 clamp(40px,13vw,56px)/1 'Prompt','Noto Sans Thai',sans-serif;letter-spacing:-.02em}
.ring .cap{font-size:14px;color:var(--muted);margin-top:4px}
.ring.over .big{color:var(--warn)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line)}
.trio>*{padding:12px 4px;text-align:center}
.trio>*+*{border-left:1px solid var(--line)}
.trio b{display:block;font:600 18px/1.2 'Prompt','Noto Sans Thai',sans-serif}
.trio span{font-size:13px;color:var(--muted)}
.trio .edit span{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;font-weight:600;font-size:17px;padding:0 16px}
.btn.food{background:var(--food);color:var(--on-food)}
.btn.lift{background:var(--lift);color:var(--on-lift)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.small{min-height:44px;font-size:15px}
.btn svg{width:20px;height:20px;flex:none}

/* meals */
.meal{margin-top:20px}
.meals .meal:first-child{margin-top:0}
.meal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.meal-h h3{margin:0;font:600 17px/1.3 'Prompt','Noto Sans Thai',sans-serif}
.meal-h .sub{color:var(--muted);font-size:14px;margin-left:8px;font-weight:400;font-family:'IBM Plex Sans Thai',sans-serif}
.plus{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.plus svg{width:20px;height:20px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;min-height:56px}
.item+.item{border-top:1px solid var(--line)}
.item .n{flex:1;min-width:0}
.item .n div:first-child{overflow-wrap:anywhere}
.item .n small{color:var(--muted);font-size:13px}
.item .k{font:600 16px 'Prompt','Noto Sans Thai',sans-serif;white-space:nowrap}
.item .k small{font:400 12px 'IBM Plex Sans Thai',sans-serif;color:var(--muted);margin-left:2px}
.empty{color:var(--muted);font-size:14px;padding:2px 2px 0;margin:0}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card h3.t{margin:0 0 4px;font:600 18px/1.3 'Prompt','Noto Sans Thai',sans-serif}
.card .sub{margin:0 0 12px;font-size:14px;color:var(--muted)}
.lbl{font-size:14px;color:var(--muted);margin-bottom:6px;display:block}
.txt{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--field);padding:0 14px;font-size:17px}
select.txt{appearance:auto}
.txt:focus,.num:focus{outline:2px solid var(--lift);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-top:8px;scrollbar-width:thin}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:15px;flex:none}
.chip.on{background:var(--lift);color:var(--on-lift);border-color:var(--lift);font-weight:600}
.chip.food.on{background:var(--food);color:var(--on-food);border-color:var(--food)}
.summary{margin-top:12px;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.row2.first{margin-top:0}
.err{color:var(--warn);font-size:14px;min-height:20px;margin-top:6px}

/* workout */
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-h h3{margin:0;font:600 18px/1.3 'Prompt','Noto Sans Thai',sans-serif;overflow-wrap:anywhere}
.ex-h .rm{font-size:13px;color:var(--muted);min-height:44px;padding:0 6px;margin:-8px -6px 0 0;flex:none}
.rm.armed,.link-danger.armed{color:var(--warn);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:2px 0 10px}
.cols,.set{display:grid;grid-template-columns:34px 1fr 1fr 46px 32px;gap:8px;align-items:center}
.cols{font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.set+.set{margin-top:8px}
.sn{text-align:center;color:var(--muted);font:500 14px 'Prompt',sans-serif}
.num{width:100%;height:48px;border-radius:12px;border:1px solid transparent;background:var(--field);text-align:center;font:500 19px 'Prompt','Noto Sans Thai',sans-serif;padding:0 4px;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num::placeholder{color:var(--muted);opacity:.55}
.ck{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--surface)}
.ck svg{width:22px;height:22px}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done .num{background:var(--ok-soft)}
.set .x{width:34px;height:44px;color:var(--muted);font-size:20px;line-height:1}
.add-set{margin-top:12px}
.addex{display:flex;gap:8px}
.addex .txt{flex:1;min-width:0}
.addex .btn{width:auto;min-height:48px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:10px 0}
.exlist>*+*{margin-top:12px}

/* weight */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.stat b{display:block;font:700 26px/1.15 'Prompt','Noto Sans Thai',sans-serif}
.stat span{font-size:13px;color:var(--muted)}
.stat.lift b{color:var(--lift)}
.good{color:var(--ok)!important}.bad{color:var(--warn)!important}
.cx{width:100%;height:auto;display:block}
.cx text{fill:var(--muted);font-size:10px;font-family:'IBM Plex Sans Thai',sans-serif}
.cx .gridl{stroke:var(--line);stroke-width:1}
.cx .ln{fill:none;stroke:var(--lift);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cx .pt{fill:var(--surface);stroke:var(--lift);stroke-width:2.5}
.cx .tg{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:4 3}
.wk .item{cursor:pointer}
.wk .when{width:78px;flex:none;font-size:14px;color:var(--muted);line-height:1.3}
.wk .when b{display:block;color:var(--ink);font:600 15px 'Prompt','Noto Sans Thai',sans-serif}
.wk .kg{font:600 18px 'Prompt','Noto Sans Thai',sans-serif}
.wk .dl{width:70px;text-align:right;font-size:14px;color:var(--muted)}

/* history */
h2.sec{font:600 18px/1.3 'Prompt','Noto Sans Thai',sans-serif;margin:24px 0 12px}
.split>.col>h2.sec:first-child,.split>.side>h2.sec:first-child{margin-top:0}
.chart{display:flex;flex-direction:column;gap:6px}
.chart .plot{position:relative;height:130px;display:flex;align-items:flex-end;gap:6px}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.chart .b{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--food);min-height:4px}
.chart .b.over{background:var(--warn)}
.chart .b.none{background:var(--line)}
.chart .gl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6;pointer-events:none}
.chart .labels,.chart .vals{display:flex;gap:6px}
.chart .labels span{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.chart .labels span.today{color:var(--ink);font-weight:600}
.chart .vals span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
.wlist .item .when{width:54px;font:600 15px/1.2 'Prompt','Noto Sans Thai',sans-serif;color:var(--lift);flex:none}
.note{font-size:13px;color:var(--muted);margin-top:24px;text-align:center}

/* profile / tdee */
.acct{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--lift);color:var(--on-lift);display:grid;place-items:center;font:600 22px 'Prompt',sans-serif;flex:none}
.acct b{display:block;font:600 18px/1.3 'Prompt','Noto Sans Thai',sans-serif}
.acct small{color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;margin-top:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--food-soft);color:var(--ink)}
.tdee{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;margin:14px 0}
.tdee>div{background:var(--field);border-radius:16px;padding:12px 14px}
.tdee span{display:block;font-size:13px;color:var(--muted)}
.tdee b{font:700 24px/1.2 'Prompt','Noto Sans Thai',sans-serif}
.tdee .big b{font-size:30px;color:var(--lift)}
.plans{display:grid;gap:12px;margin-bottom:12px}
.plan{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;min-height:60px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.plan b{display:block;font-weight:600}
.plan small{color:var(--muted);font-size:13px}
.plan strong{font:700 20px 'Prompt','Noto Sans Thai',sans-serif}
.plan.on{border-color:var(--food);background:var(--food-soft)}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.fine{font-size:13px;color:var(--muted);margin:12px 0 0}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500;min-width:0}
.tab span{white-space:nowrap}
.tab svg{width:24px;height:24px;flex:none}
.tab.on{color:var(--ink);background:var(--field);font-weight:600}
.tab.on.t-food svg{color:var(--food)}
.tab.on.t-work svg,.tab.on.t-weight svg{color:var(--lift)}
.brand{display:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 14px;font:600 20px/1.3 'Prompt','Noto Sans Thai',sans-serif}
.sheet h2 small{font:400 14px 'IBM Plex Sans Thai',sans-serif;color:var(--muted);margin-left:6px}
.sheet .actions{display:flex;gap:10px;margin-top:10px}
.link-danger{display:block;margin:12px auto 0;min-height:44px;padding:0 12px;color:var(--muted);font-size:15px}
.libres{margin-top:12px;max-height:min(46vh,420px);overflow:auto}
.addmark{font-size:14px;color:var(--lift);font-weight:600;flex:none}
.addmark.on{color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;text-align:center}
[hidden]{display:none!important}
button:focus-visible,.txt:focus-visible,.num:focus-visible{outline:2px solid var(--lift);outline-offset:2px}

/* v3 additions */
.sn{width:34px;height:40px;border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--muted);font:500 14px 'Prompt',sans-serif}
.sn.warm{background:var(--lift-soft);color:var(--lift);font-weight:700}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.row3 .txt{padding:0 6px;text-align:center;font:500 18px 'Prompt','Noto Sans Thai',sans-serif}
.row3 .lbl{font-size:12px;text-align:center;min-height:34px;display:flex;align-items:flex-end;justify-content:center;line-height:1.25}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat em{display:block;font-style:normal;font-size:13px;margin-top:2px;color:var(--muted);font-weight:600}
.sub2{display:block;font-size:12px;color:var(--muted);font-weight:400}
.rngs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.tr-h h3{margin:0;font:600 17px/1.3 'Prompt','Noto Sans Thai',sans-serif}
.chg{font:600 14px/1.3 'Prompt','Noto Sans Thai',sans-serif;text-align:right}
.chg small{display:block;font:400 12px 'IBM Plex Sans Thai',sans-serif;color:var(--muted)}
.cx .ln.c2{stroke:var(--food)}.cx .pt.c2{stroke:var(--food)}
.cx .ln.c3{stroke:var(--ok)}.cx .pt.c3{stroke:var(--ok)}
.chart.dense .plot,.chart.dense .labels{gap:2px}
.chart.dense .b{border-radius:3px 3px 2px 2px;min-height:2px}
.chart .labels span{white-space:nowrap;overflow:visible}
.streak{display:flex;gap:16px;align-items:center}
.flame{width:76px;height:76px;flex:none}
.streak .n2{font:700 46px/1 'Prompt','Noto Sans Thai',sans-serif}
.streak .lab{color:var(--muted);font-size:14px;margin-top:2px}
.streak b{font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted)}
.wd i svg{width:18px;height:18px}
.wd.w i{background:var(--lift);border-color:var(--lift);color:var(--on-lift)}
.wd.r i{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.wd.t i{outline:2px solid var(--lift);outline-offset:2px}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhd b{font:600 18px 'Prompt','Noto Sans Thai',sans-serif;text-align:center;flex:1}
.nav2{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.nav2 svg{width:20px;height:20px}
.dow,.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{min-height:56px;border-radius:12px;background:var(--field);display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px 4px;font:500 15px 'Prompt','Noto Sans Thai',sans-serif}
.cell.blank{background:none;pointer-events:none}
.cell.work{background:var(--lift-soft)}
.cell.rest{background:var(--ok-soft)}
.cell.today{outline:2px solid var(--lift);outline-offset:-2px}
.cell.fut{opacity:.65}
.mk{display:flex;gap:4px;height:9px;align-items:center}
.dot{display:block;width:8px;height:8px;border-radius:50%}
.dot.food{background:var(--food)}
.dot.work{background:var(--lift);border-radius:2px}
.dot.rest{background:var(--ok);border-radius:2px;transform:rotate(45deg) scale(.85)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.reprow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:420px){.tab{font-size:11px}.tab svg{width:22px;height:22px}}
@media (min-width:720px){.stats.four{grid-template-columns:repeat(4,1fr)}}

const DEF_PROFILE=()=>({sex:'m',age:'',h:'',w:'',act:1.375,plan:'lose',startW:'',targetW:''});
const S={days:{},goal:2000,profile:DEF_PROFILE(),date:todayKey(),tab:'food',mode:'local',sheet:null,calM:todayKey().slice(0,7),hr:'30',wm:'vol',pex:'',rep:{p:'7',from:'',to:''},me:null,auth:'loading',authTab:'login'};
const EMPTY=()=>({meals:[],workout:{label:'',exercises:[]}});
const getDay=k=>S.days[k]||EMPTY();
const ensureDay=k=>{if(!S.days[k])S.days[k]=EMPTY();return S.days[k]};
const isEmpty=d=>!d.meals.length&&!d.workout.label&&!d.workout.exercises.length&&!d.weight&&!d.fat&&!d.muscle&&!(d.cardio&&d.cardio.length);

const LS_PREFIX='fitlog.v3.';
let sb=null,UID=null,lastLoad=0,loadedOnce=false,settingsPending=false,settingsTimer;
const lsKey=()=>LS_PREFIX+(UID||'local');
function readLS(key){try{const r=localStorage.getItem(key);return r?JSON.parse(r):null}catch(e){return null}}
function loadLocal(){
  let o=readLS(lsKey());
  if(!o&&!UID)o=readLS('fitlog.v2')||readLS('fitlog.v1');
  S.days=(o&&o.days)||{};
  S.goal=(o&&o.goal)||2000;
  S.profile=Object.assign(DEF_PROFILE(),(o&&o.profile)||{});
}
function saveLocal(){
  try{localStorage.setItem(lsKey(),JSON.stringify({days:S.days,goal:S.goal,profile:S.profile}))}catch(e){}
}
const timers={},pending=new Set(),failed=new Set();
let toastT;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200);
}
function persist(k){
  if(S.days[k]&&isEmpty(S.days[k]))delete S.days[k];
  saveLocal();
  if(S.mode!=='cloud'||!sb||!UID)return;
  const uid=UID;
  pending.add(k);
  clearTimeout(timers[k]);
  timers[k]=setTimeout(async()=>{
    try{
      const d=S.days[k];
      let r;
      if(d)r=await sb.from('days').upsert({user_id:uid,date:k,data:JSON.parse(JSON.stringify({meals:d.meals,workout:d.workout,weight:d.weight,fat:d.fat,muscle:d.muscle,cardio:d.cardio}))},{onConflict:'user_id,date'});
      else r=await sb.from('days').delete().eq('user_id',uid).eq('date',k);
      if(r&&r.error)throw r.error;
      failed.delete(k);
    }catch(e){failed.add(k);toast('บันทึกขึ้นระบบไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้')}
    pending.delete(k);
  },350);
}
function persistSettings(){
  saveLocal();
  if(S.mode!=='cloud'||!sb||!UID)return;
  const uid=UID;
  settingsPending=true;
  clearTimeout(settingsTimer);
  settingsTimer=setTimeout(async()=>{
    try{
      const r=await sb.from('settings').upsert({user_id:uid,data:JSON.parse(JSON.stringify({goal:S.goal,profile:S.profile}))},{onConflict:'user_id'});
      if(r&&r.error)throw r.error;
    }catch(e){toast('บันทึกการตั้งค่าขึ้นระบบไม่สำเร็จ')}
    settingsPending=false;
  },400);
}
async function fetchAllDays(uid){
  const out=[];let from=0;
  for(;;){
    const r=await sb.from('days').select('date,data').eq('user_id',uid).order('date').range(from,from+999);
    if(r.error)throw r.error;
    out.push.apply(out,r.data);
    if(r.data.length<1000)break;
    from+=1000;
  }
  return out;
}
async function loadCloud(){
  if(!sb||!UID)return;
  const uid=UID;
  lastLoad=Date.now();
  const rows=await fetchAllDays(uid);
  const sr=await sb.from('settings').select('data').eq('user_id',uid).maybeSingle();
  if(sr.error)throw sr.error;
  if(uid!==UID)return;
  const days={};
  rows.forEach(r=>{const x=r.data||{};days[r.date]={meals:x.meals||[],workout:x.workout||{label:'',exercises:[]},weight:x.weight,fat:x.fat,muscle:x.muscle,cardio:x.cardio}});
  let goal=S.goal,profile=S.profile;
  const st=sr.data&&sr.data.data;
  if(st){if(st.goal>0)goal=st.goal;if(st.profile)profile=Object.assign(DEF_PROFILE(),st.profile)}
  if(!rows.length&&!st&&!loadedOnce){
    loadedOnce=true;
    if(!Object.keys(S.days).length){
      const old=readLS(LS_PREFIX+'local')||readLS('fitlog.v2')||readLS('fitlog.v1');
      if(old&&old.days){S.days=old.days;S.goal=old.goal||2000;S.profile=Object.assign(DEF_PROFILE(),old.profile||{})}
    }
    if(Object.keys(S.days).length){
      Object.keys(S.days).forEach(persist);persistSettings();
      toast('ย้ายข้อมูลที่เคยบันทึกในเครื่องนี้ขึ้นบัญชีแล้ว');
      requestRender();
    }
    return;
  }
  loadedOnce=true;
  pending.forEach(k=>{if(S.days[k])days[k]=S.days[k];else delete days[k]});
  if(settingsPending){goal=S.goal;profile=S.profile}
  const changed=JSON.stringify(days)!==JSON.stringify(S.days)||goal!==S.goal||JSON.stringify(profile)!==JSON.stringify(S.profile);
  S.days=days;S.goal=goal;S.profile=profile;saveLocal();
  if(changed)requestRender();
}
function startSession(user){
  if(UID===user.id&&S.auth==='in')return;
  UID=user.id;
  const m=user.user_metadata||{};
  S.me={name:m.name||'',phone:m.phone||''};
  S.mode='cloud';S.auth='in';loadedOnce=false;
  loadLocal();
  S.date=todayKey();S.tab='food';
  render();
  loadCloud().catch(()=>toast('โหลดข้อมูลจากระบบไม่สำเร็จ แสดงข้อมูลที่ค้างในเครื่องไว้ก่อน'));
}
function endSession(){
  Object.keys(timers).forEach(k=>clearTimeout(timers[k]));
  pending.clear();
  UID=null;S.me=null;S.mode='local';S.auth='out';S.authTab='login';
  S.days={};S.goal=2000;S.profile=DEF_PROFILE();S.sheet=null;
  render();renderSheet();
}
function initAuth(){
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{
      if(session&&session.user)startSession(session.user);
      else if(S.auth!=='out')endSession();
    },0);
  });
  sb.auth.getSession().then(r=>{
    if(S.auth!=='loading')return;
    if(r.data&&r.data.session)startSession(r.data.session.user);
    else{S.auth='out';render()}
  }).catch(()=>{if(S.auth==='loading'){S.auth='out';render()}});
}

];
const CF={min:['เวลา (นาที)','1'],speed:['ความเร็ว (กม./ชม.)','0.1'],incline:['ความชัน (%)','0.5'],level:['ระดับ / แรงต้าน','1'],dist:['ระยะทาง (กม.)','0.01'],kcal:['แคลอรี่ที่เผาผลาญ (kcal)','1'],hr:['ชีพจรเฉลี่ย (bpm)','1'],hrmax:['ชีพจรสูงสุด (bpm)','1']};
const cmeta=t=>CARDIO.find(x=>x[0]===t)||[t,t,'',[]];
const cname=t=>{const m=cmeta(t);return m[1]+(m[2]?' ('+m[2]+')':'')};
const cvalid=c=>Number(c.min)>0||Number(c.kcal)>0||Number(c.dist)>0;
function cardioTotals(d){
  let n=0,min=0,kcal=0,hs=[];
  (d.cardio||[]).forEach(c=>{
    if(!cvalid(c))return;
    n++;min+=Number(c.min)||0;kcal+=Number(c.kcal)||0;
    if(Number(c.hr)>0)hs.push(Number(c.hr));
  });
  return {n:n,min:min,kcal:kcal,hr:hs.length?hs.reduce((a,b)=>a+b,0)/hs.length:0};
}
function hasWeights(d){return d.workout.exercises.some(e=>e.sets.some(validSet))}
function isWorkoutDay(d){return hasWeights(d)||cardioTotals(d).n>0}
function dayTitle(d){return d.workout.label||(hasWeights(d)?'เวทเทรนนิ่ง':'คาร์ดิโอ')}
function dayBrief(d){
  const st=wstats(d),parts=[],c=cardioTotals(d);
  if(st.sets||st.ex)parts.push(st.ex+' ท่า · '+st.sets+' เซ็ต');
  if(c.n)parts.push('คาร์ดิโอ '+fmt(c.min)+' นาที'+(c.kcal?' · '+fmt(c.kcal)+' kcal':''));
  return parts.join(' + ')||'เวิร์คเอาท์';
}
function wstats(d){
  let ex=0,sets=0,vol=0;
  d.workout.exercises.forEach(e=>{
    const v=e.sets.filter(validSet);
    if(v.length)ex++;
    v.forEach(s=>{if(!isWarm(s)){sets++;vol+=(Number(s.w)||0)*Number(s.r)}});
  });
  return {ex:ex,sets:sets,vol:vol};
}
function prevOf(name,k){
  const n=name.toLowerCase();
  const ks=Object.keys(S.days).filter(x=>x<k).sort().reverse();
  for(const x of ks){
    const e=S.days[x].workout.exercises.find(e=>e.name.toLowerCase()===n&&e.sets.some(validSet));
    if(e)return {k:x,e:e};
  }
  return null;
}
function prevLabelDay(label,k){
  const l=label.toLowerCase();
  const ks=Object.keys(S.days).filter(x=>x<k).sort().reverse();
  for(const x of ks){
    const w=S.days[x].workout;
    if(w.label.toLowerCase()===l&&w.exercises.length)return x;
  }
  return null;
}
function recents(){
  const seen=new Map();
  Object.keys(S.days).sort().reverse().forEach(k=>S.days[k].meals.forEach(m=>{
    const n=m.name.toLowerCase();if(!seen.has(n))seen.set(n,m);
  }));
  return Array.from(seen.values()).slice(0,10);
}
function exNames(){
  const set=new Set(LIB.map(x=>x.n));
  Object.keys(S.days).forEach(k=>S.days[k].workout.exercises.forEach(e=>set.add(e.name)));
  return Array.from(set);
}
function guessMeal(){const h=new Date().getHours();return h<10?'b':h<15?'l':h<20?'d':'s'}
function weekStart(k){const d=fromKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function weighIns(){
  return Object.keys(S.days).filter(k=>S.days[k].weight>0).sort().map(k=>({k:k,kg:Number(S.days[k].weight)}));
}
function latestWeight(){const w=weighIns();return w.length?w[w.length-1].kg:0}
function calc(){
  const p=S.profile,w=Number(p.w)||latestWeight(),h=Number(p.h),a=Number(p.age);
  if(!(w>0&&h>0&&a>0))return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);
  return {bmr:bmr,tdee:bmr*Number(p.act),w:w};
}

function dateTitle(k){

}

const dateShort=k=>fromKey(k).toLocaleDateString('th-TH',{day:'numeric',month:'short'});

/* ---------- render: workout ---------- */
function exHTML(e,k){
  const prev=prevOf(e.name,k);
  const ps=prev?prev.e.sets:[];
  let hint='';
  if(prev){
    const wk=prev.e.sets.filter(s=>validSet(s)&&!isWarm(s));
    const show=wk.length?wk:prev.e.sets.filter(validSet);
    hint='<div class="hint">ครั้งก่อน ('+dateShort(prev.k)+'): '+show.map(s=>(Number(s.w)||0)+'×'+s.r).join(' · ')+'</div>';
  }
  let wn=0;
  const rows=e.sets.map((s,i)=>{
    const p=ps[i]||ps[ps.length-1]||{};
    const warm=isWarm(s);
    if(!warm)wn++;

function cardioSummary(d){
  const t=cardioTotals(d);
  if(!t.n)return 'ยังไม่มีคาร์ดิโอ';
  return 'รวม <b>'+fmt(t.min)+'</b> นาที'+(t.kcal?' · เผาผลาญ <b>'+fmt(t.kcal)+'</b> kcal':'')+(t.hr?' · ชีพจรเฉลี่ย <b>'+fmt(t.hr)+'</b>':'');
}
function prevCardio(type,k){
  const ks=Object.keys(S.days).filter(x=>x<k).sort().reverse();
  for(const x of ks){
    const list=(S.days[x].cardio||[]).filter(c=>c.type===type&&cvalid(c));
    if(list.length)return {k:x,c:list[list.length-1]};
  }
  return null;
}
function cardioCard(c){
  const m=cmeta(c.type),prev=prevCardio(c.type,S.date);
  const fields=['min'].concat(m[3],['kcal','hr','hrmax']);
  let hint='';
  if(prev){
    const q=prev.c,bits=[];
    if(q.min)bits.push(q.min+' นาที');
    if(q.speed)bits.push(q.speed+' กม./ชม.');
    if(q.incline!==''&&q.incline!=null)bits.push('ชัน '+q.incline+'%');
    if(q.level)bits.push('ระดับ '+q.level);
    if(q.dist)bits.push(q.dist+' กม.');
    if(q.kcal)bits.push(q.kcal+' kcal');
    if(q.hr)bits.push('HR '+q.hr);
    hint='<div class="hint">ครั้งก่อน ('+dateShort(prev.k)+'): '+bits.join(' · ')+'</div>';
  }
  const inputs=fields.map(f=>{
    const pv=prev&&prev.c[f]!==''&&prev.c[f]!=null?prev.c[f]:'';
    return '<div><label class="lbl" for="c'+c.id+f+'">'+CF[f][0]+'</label><input id="c'+c.id+f+'" class="txt" type="number" inputmode="decimal" step="'+CF[f][1]+'" min="0" data-c="'+f+'" data-cid="'+c.id+'" value="'+(c[f]==null?'':esc(c[f]))+'" placeholder="'+esc(pv)+'"></div>';
  }).join('');
  return '<section class="card" data-cardio="'+c.id+'"><div class="ex-h"><h3>'+esc(m[1])+(m[2]?'<small>'+esc(m[2])+'</small>':'')+'</h3><button class="rm" data-act="delcardio" data-cid="'+c.id+'">ลบ</button></div>'+hint+'<div class="cf">'+inputs+'</div></section>';
}
function cardioBlock(d){
  const list=d.cardio||[];
  return '<div class="sec-h"><h2 class="sec">คาร์ดิโอ</h2><span class="sec-r" id="csum">'+cardioSummary(d)+'</span></div>'+
    (list.length?'<div class="cardios">'+list.map(cardioCard).join('')+'</div>':'')+
    '<section class="card"'+(list.length?' style="margin-top:12px"':'')+'><span class="lbl">เพิ่มคาร์ดิโอ เลือกเครื่องหรือประเภท</span><div class="chips">'+
    CARDIO.map(m=>'<button class="chip" data-act="addcardio" data-t="'+m[0]+'">'+m[1]+'</button>').join('')+'</div></section>';
}
function cardioSumCard(R){
  const agg={};let n=0,min=0,kc=0,hs=[];
  Object.keys(S.days).filter(k=>k>=R.from&&k<=R.to).forEach(k=>{
    (S.days[k].cardio||[]).forEach(c=>{
      if(!cvalid(c))return;
      const a=agg[c.type]||(agg[c.type]={n:0,min:0,kcal:0});
      a.n++;a.min+=Number(c.min)||0;a.kcal+=Number(c.kcal)||0;
      n++;min+=Number(c.min)||0;kc+=Number(c.kcal)||0;
      if(Number(c.hr)>0)hs.push(Number(c.hr));
    });
  });
  if(!n)return '<section class="card"><h3 class="t">คาร์ดิโอ</h3><p class="empty">ยังไม่มีคาร์ดิโอในช่วงนี้</p></section>';
  const hr=hs.length?hs.reduce((a,b)=>a+b,0)/hs.length:0;
  return '<section class="card"><h3 class="t">คาร์ดิโอ</h3><div class="stats four" style="margin:12px 0 8px">'+
    '<div class="stat"><b>'+n+'</b><span>ครั้ง</span></div><div class="stat"><b>'+fmt(min)+'</b><span>นาที</span></div>'+
    '<div class="stat"><b>'+fmt(kc)+'</b><span>เผาผลาญ (kcal)</span></div><div class="stat"><b>'+(hr?fmt(hr):'–')+'</b><span>ชีพจรเฉลี่ย (bpm)</span></div></div>'+
    Object.keys(agg).sort((a,b)=>agg[b].min-agg[a].min).map(t=>'<div class="mini"><span>'+esc(cmeta(t)[1])+'</span><span>'+agg[t].n+' ครั้ง · '+fmt(agg[t].min)+' นาที'+(agg[t].kcal?' · '+fmt(agg[t].kcal)+' kcal':'')+'</span></div>').join('')+'</section>';
}

/* ---------- workout evaluation ---------- */
const LV=[
  {t:'เบา',tip:'เบากว่าที่คุณทำเป็นประจำ ถ้าตั้งใจให้เป็นวันฟื้นตัวถือว่าเหมาะ แต่ถ้ายังมีแรงเหลือ ลองเพิ่มเซ็ตหรือเพิ่มน้ำหนักในครั้งหน้า'},
  {t:'ดี',tip:'ออกกำลังกายได้ดี ต่ำกว่าที่คุณทำประจำเล็กน้อย ถ้าวันนี้รู้สึกมีแรง ครั้งหน้าลองเพิ่มอีกนิด'},
  {t:'GREAT',tip:'เยี่ยม! หนักพอดีเมื่อเทียบกับที่คุณทำประจำ เป็นระดับที่ช่วยพัฒนาต่อเนื่อง อย่าลืมกินโปรตีนและนอนให้พอเพื่อฟื้นตัว'},
  {t:'หนัก',tip:'หนักกว่าปกติอย่างชัดเจน กินให้พอและนอนให้เต็มที่ วันถัดไปควรเบาลงหรือพัก'},
  {t:'หนักมาก',tip:'หนักมากเมื่อเทียบกับที่คุณทำประจำ เสี่ยงล้าสะสม แนะนำพักหรือฝึกเบา ๆ 1–2 วัน ดื่มน้ำและกินให้พอ'}
];
const LV_CUT=[25,17.5,20,17.5,20];
function e1(w,r){return r<=1?w:w*(1+r/30)}
function bestE1(e){
  let b=0;
  e.sets.forEach(s=>{
    if(isWarm(s)||!validSet(s))return;
    const w=Number(s.w)||0,r=Number(s.r);
    if(w>0&&r<=12){const v=e1(w,r);if(v>b)b=v}
  });
  return b;
}
function cFactor(c,maxHr){
  const hr=Number(c.hr)||0,m=Number(c.min)||0,kc=Number(c.kcal)||0;
  if(hr>0){const p=hr/Math.max(maxHr,Number(c.hrmax)||0);return p<0.6?1:p<0.7?2:p<0.8?3:p<0.9?4:5}
  if(kc>0&&m>0)return Math.min(5,Math.max(1,kc/m/3.5));
  return 2;
}
function loadOf(d,maxHr){
  const st=wstats(d);
  const sp=st.sets*6+st.vol/500;
  let cmin=0,cp=0;
  (d.cardio||[]).forEach(c=>{
    if(!cvalid(c))return;
    let m=Number(c.min)||0;
    if(!m&&Number(c.kcal)>0)m=Number(c.kcal)/7;
    cmin+=m;cp+=m*cFactor(c,maxHr);
  });
  return {sets:st.sets,vol:st.vol,sp:sp,cmin:cmin,cp:cp,total:sp+cp};
}
function makeCtx(){
  const maxHr=Number(S.profile.age)>0?220-Number(S.profile.age):190;
  const LM={},PR={},best={};
  Object.keys(S.days).forEach(k=>{const d=S.days[k];if(isWorkoutDay(d))LM[k]=loadOf(d,maxHr)});
  Object.keys(S.days).sort().forEach(k=>{
    S.days[k].workout.exercises.forEach(e=>{
      const n=e.name.toLowerCase(),b=bestE1(e);
      if(b<=0)return;
      const pb=best[n]||0;
      if(pb>0&&b>pb*1.01)(PR[k]=PR[k]||[]).push({name:e.name,e1:b,prior:pb});
      if(b>pb)best[n]=b;
    });
  });
  return {LM:LM,PR:PR,maxHr:maxHr};
}
function evalDay(k,ctx){
  const L=ctx.LM[k];
  if(!L)return null;
  const comp=(f,def)=>{
    let sum=0,n=0;
    for(let i=1;i<=28;i++){const x=ctx.LM[addDays(k,-i)];if(x&&x[f]>0){sum+=x[f];n++}}
    return n>=3?{v:sum/n,n:n,ok:true}:{v:def,n:n,ok:false};
  };
  const bs=L.sp>0?comp('sp',80):null,bc=L.cp>0?comp('cp',90):null;
  const base=(bs?bs.v:0)+(bc?bc.v:0),enough=(!bs||bs.ok)&&(!bc||bc.ok),n=Math.min(bs?bs.n:99,bc?bc.n:99);
  const r=L.total/base;
  let lv=r<0.5?0:r<0.85?1:r<=1.25?2:r<=1.6?3:4;
  const prs=ctx.PR[k]||[];
  const bumped=prs.length>0&&lv===1;
  if(bumped)lv=2;
  let acute=0,chronic=0;
  for(let i=0;i<28;i++){const x=ctx.LM[addDays(k,-i)];if(x){chronic+=x.total;if(i<7)acute+=x.total}}
  chronic=chronic/4;
  const hasHist=Object.keys(ctx.LM).some(x=>x<=addDays(k,-14));
  return {k:k,L:L,base:base,bs:bs,bc:bc,n:n,enough:enough,r:r,lv:lv,prs:prs,bumped:bumped,acwr:hasHist&&chronic>0?acute/chronic:0};
}
function evalInner(k,ctx){
  const d=S.days[k];
  if(d&&isRest(d)&&!isWorkoutDay(d))return '<div class="ev-h l1"><div class="ev-badge">วันพัก</div><div><b>วันนี้เป็นวันพัก</b><small>ให้ร่างกายได้ฟื้นตัว นอนให้พอและกินโปรตีนให้ถึงเป้า</small></div></div>';
  const e=evalDay(k,ctx);

  let h='<div class="ev-h l'+e.lv+'"><div class="ev-badge">'+lv.t+'</div><div><b>'+pct+'% ของที่คุณทำประจำ</b><small>'+(e.enough?'เทียบกับค่าเฉลี่ยของงานแบบเดียวกันใน 28 วันที่ผ่านมา':'ยังมีข้อมูลน้อย ใช้เกณฑ์มาตรฐานบางส่วนไปก่อน')+'</small></div></div>'+
    '<div class="gwrap"><div class="gauge">'+LV_CUT.map((w,i)=>'<i class="l'+i+(i===e.lv?' on':'')+'" style="flex:'+w+'"></i>').join('')+'</div><span class="mk2" style="left:'+mk.toFixed(1)+'%"></span></div>'+
    '<div class="glab">'+LV.map((x,i)=>'<span style="flex:'+LV_CUT[i]+'">'+x.t+'</span>').join('')+'</div>'+
    '<p class="ev-tip">'+lv.tip+'</p>';
  if(e.prs.length)h+='<div class="prs">★ สถิติใหม่'+(e.bumped?' (ยกระดับเป็น GREAT)':'')+': '+e.prs.map(x=>esc(x.name)+' ≈ '+Math.round(x.e1)+' กก. (เดิม '+Math.round(x.prior)+')').join(' · ')+'</div>';
  if(e.acwr>1.5)h+='<div class="evnote">ภาระ 7 วันล่าสุดสูงกว่าค่าปกติของคุณ '+Math.round((e.acwr-1)*100)+'% ระวังความล้าสะสม พิจารณาพักหรือฝึกเบาลง</div>';
  else if(e.acwr>0&&e.acwr<0.6)h+='<div class="evnote">7 วันล่าสุดฝึกน้อยกว่าปกติของคุณ ถ้าไม่ได้ตั้งใจพัก ลองกลับมาสม่ำเสมออีกครั้ง</div>';
  const cf=L.cmin>0?L.cp/L.cmin:0;
  h+='<details class="ev-d"><summary>ดูรายละเอียดการคำนวณ</summary>'+
    '<div class="mini"><span>เวทเทรนนิ่ง</span><span>'+L.sets+' เซ็ต · '+fmt(L.vol)+' กก. → '+Math.round(L.sp)+' คะแนน</span></div>'+
    '<div class="mini"><span>คาร์ดิโอ</span><span>'+(L.cmin>0?fmt(L.cmin)+' นาที · ความหนัก ×'+fmt1(cf)+' → '+Math.round(L.cp)+' คะแนน':'ไม่มี')+'</span></div>'+
    '<div class="mini"><span>รวมวันนี้</span><span><b>'+Math.round(L.total)+' คะแนน</b></span></div>'+
    '<div class="mini"><span>ค่าปกติของคุณ</span><span>'+Math.round(e.base)+' คะแนน'+(e.bs?' · เวท '+Math.round(e.bs.v)+(e.bs.ok?' (เฉลี่ย '+e.bs.n+' ครั้ง)':' (เกณฑ์มาตรฐาน)'):'')+(e.bc?' · คาร์ดิโอ '+Math.round(e.bc.v)+(e.bc.ok?' (เฉลี่ย '+e.bc.n+' ครั้ง)':' (เกณฑ์มาตรฐาน)'):'')+'</span></div>'+
    '<p class="fine">คะแนนภาระ = เซ็ตเวทจริง (ไม่รวมวอร์มอัพ) × 6 + ปริมาณเวท (กก.) ÷ 500 + คาร์ดิโอ (นาที × ระดับความหนัก 1–5 จากชีพจรเฉลี่ยเทียบชีพจรสูงสุดประมาณ '+ctx.maxHr+' bpm หรือจากแคลอรี่ต่อนาทีถ้าไม่มีชีพจร) '+
    'แล้วเทียบกับค่าเฉลี่ยของงานแบบเดียวกัน (เวทกับเวท คาร์ดิโอกับคาร์ดิโอ) ใน 28 วันก่อนหน้า ถ้ายังมีน้อยกว่า 3 ครั้งจะใช้เกณฑ์มาตรฐานแทน: ต่ำกว่า 50% เบา · 50–85% ดี · 85–125% GREAT · 125–160% หนัก · เกิน 160% หนักมาก '+

function weeklyCard(R,ctx){
  const t=todayKey(),cur=weekStart(t),first=weekStart(R.from);
  const wks=[];for(let w=cur;w>=first&&wks.length<26;w=addDays(w,-7))wks.unshift(w);
  const M={vol:['ปริมาณเวท (กก.)',v=>v>=1000?(v/1000).toFixed(1)+'k':fmt(v),'lb'],sets:['เซ็ตเวท','lb'],cmin:['คาร์ดิโอ (นาที)',null,''],days:['วันออกกำลังกาย',null,'lb']};
  const mk=S.wm in M?S.wm:'vol';
  const vals=wks.map(w=>{
    let v=0;
    for(let i=0;i<7;i++){
      const k=addDays(w,i);if(k>t)break;
      const x=ctx.LM[k];if(!x)continue;
      v+=mk==='vol'?x.vol:mk==='sets'?x.sets:mk==='cmin'?x.cmin:1;
    }
    return v;
  });
  const cls=mk==='cmin'?'':'lb';
  const items=wks.map((w,i)=>({v:vals[i],cls:cls,label:dateShort(w),today:w===cur}));
  const chips=[['vol','ปริมาณเวท'],['sets','เซ็ต'],['cmin','คาร์ดิโอ (นาที)'],['days','จำนวนวัน']].map(x=>'<button class="chip'+(mk===x[0]?' on':'')+'" data-act="wmetric" data-v="'+x[0]+'">'+x[1]+'</button>').join('');
  const tot=vals.reduce((a,b)=>a+b,0),avg=vals.length?tot/vals.length:0;
  const unit=mk==='vol'?'กก.':mk==='sets'?'เซ็ต':mk==='cmin'?'นาที':'วัน';
  return '<section class="card"><div class="tr-h"><h3>สรุปรายสัปดาห์</h3><span class="chg" style="color:var(--muted)">เฉลี่ย '+fmt(avg)+' '+unit+'/สัปดาห์<small>สัปดาห์เริ่มวันจันทร์</small></span></div>'+
    '<div class="chips scroll" style="margin:0 0 10px">'+chips+'</div>'+
    (tot>0?barsHTML(items,{fmt:mk==='vol'?M.vol[1]:fmt}):'<p class="empty">ยังไม่มีข้อมูลในช่วงนี้</p>')+'</section>';
}
function exSeries(name){
  const n=name.toLowerCase(),byDay={};let useKg=false;
  Object.keys(S.days).sort().forEach(k=>{
    S.days[k].workout.exercises.forEach(e=>{
      if(e.name.toLowerCase()!==n)return;
      let b=0,reps=0;
      e.sets.forEach(s=>{
        if(isWarm(s)||!validSet(s))return;
        const w=Number(s.w)||0,r=Number(s.r);
        if(w>0){useKg=true;if(r<=12){const v=e1(w,r);if(v>b)b=v}}
        if(r>reps)reps=r;
      });
      const cur=byDay[k]||{b:0,reps:0};
      byDay[k]={b:Math.max(cur.b,b),reps:Math.max(cur.reps,reps)};
    });
  });
  return {unit:useKg?'กก.':'ครั้ง',pts:Object.keys(byDay).sort().map(k=>({k:k,v:useKg?byDay[k].b:byDay[k].reps})).filter(x=>x.v>0)};
}
function progCard(R){
  const cnt={},disp={};
  Object.keys(S.days).forEach(k=>S.days[k].workout.exercises.forEach(e=>{
    if(!e.sets.some(validSet))return;
    const n=e.name.toLowerCase();cnt[n]=(cnt[n]||0)+1;disp[n]=e.name;
  }));
  const names=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,10);
  if(!names.length)return '<section class="card"><h3 class="t">พัฒนาการรายท่า</h3><p class="empty">บันทึกเวทเทรนนิ่งก่อน แล้วจะเห็นกราฟน้ำหนักที่ยกได้ของแต่ละท่า</p></section>';
  const sel=names.indexOf(S.pex.toLowerCase())>=0?S.pex.toLowerCase():names[0];
  const sr=exSeries(disp[sel]);
  const chips='<div class="chips scroll" style="margin:0 0 10px">'+names.map(n=>'<button class="chip'+(n===sel?' on':'')+'" data-act="pickprog" data-n="'+esc(disp[n])+'">'+esc(disp[n])+'</button>').join('')+'</div>';
  return trendCard('พัฒนาการ: '+esc(disp[sel]),sr.pts,'up',sr.unit==='กก.'?0:0,sr.unit,'',R,chips+(sr.unit==='กก.'?'<div class="legend" style="margin:0 0 6px">กราฟนี้ใช้ค่า 1RM โดยประมาณจากเซ็ตจริงที่ดีที่สุดของแต่ละวัน</div>':'<div class="legend" style="margin:0 0 6px">ท่านี้ไม่ได้ใส่น้ำหนัก กราฟแสดงจำนวนครั้งสูงสุดต่อเซ็ต</div>'));
}

const fmtN=(n,d)=>(Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
function seriesOf(f){return Object.keys(S.days).filter(k=>Number(S.days[k][f])>0).sort().map(k=>({k:k,v:Number(S.days[k][f])}))}
function fatMassSeries(){
  return Object.keys(S.days).filter(k=>Number(S.days[k].weight)>0&&Number(S.days[k].fat)>0).sort().map(k=>({k:k,v:Number(S.days[k].weight)*Number(S.days[k].fat)/100}));

function goodClass(df,dir){
  if(Math.abs(df)<0.05||!dir)return '';
  if(dir==='down')return df<0?'good':'bad';
  return df>0?'good':'bad';
}
function weightDir(){return S.profile.plan==='lose'?'down':S.profile.plan==='gain'?'up':''}
function statCard(label,series,dir,dec,cls){
  const last=series.length?series[series.length-1].v:0;
  let d='';
  if(series.length>=2){
    const df=last-series[0].v;
    d='<em class="'+goodClass(df,dir)+'">'+(Math.abs(df)<0.05?'คงที่':(df>0?'▲ ':'▼ ')+fmtN(Math.abs(df),dec))+'</em>';
  }
  return '<div class="stat'+(cls?' '+cls:'')+'"><b>'+(last?fmtN(last,dec):'–')+'</b><span>'+label+'</span>'+d+'</div>';
}
function weeklyPoints(){

function weightChart(pts,target){
  if(pts.length<2)return '<p class="empty">ชั่งอย่างน้อย 2 สัปดาห์ เพื่อดูกราฟแนวโน้ม</p>';

  s+='<polyline class="ln" points="'+p.map((q,i)=>x(i).toFixed(1)+','+y(q.kg).toFixed(1)).join(' ')+'"/>';

function inRange(series,R){return series.filter(x=>x.k>=R.from&&x.k<=R.to)}

const isRest=d=>d.workout.label==='พัก';
function dayType(k){
  const d=S.days[k];
  if(!d)return {food:false,work:false,rest:false};
  const w=isWorkoutDay(d);
  return {food:d.meals.length>0,work:w,rest:!w&&isRest(d)};
}
function streakInfo(){
  const t=todayKey();
  const typ=k=>{const x=dayType(k);return x.work?'w':x.rest?'r':''};
  let k=t,cur=0,guard=0;
  if(typ(k)==='')k=addDays(k,-1);
  while(guard++<5000){
    const y=typ(k);
    if(y==='w')cur++;
    else if(y!=='r')break;
    k=addDays(k,-1);
  }
  const ks=Object.keys(S.days).sort();
  let best=0,run=0;
  if(ks.length){
    for(let d=ks[0],g=0;d<=t&&g<5000;d=addDays(d,1),g++){
      const y=typ(d);
      if(y==='w'){run++;if(run>best)best=run}
      else if(y!=='r')run=0;
    }
  }
  return {cur:cur,best:best,todayOpen:typ(t)===''};
}
const flameSvg=on=>'<svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--food)"/><stop offset="1" style="stop-color:var(--lift)"/></linearGradient></defs><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" style="fill:'+(on?'url(#fg)':'none')+';stroke:'+(on?'var(--lift)':'var(--muted)')+';stroke-width:1.4;stroke-linejoin:round"/></svg>';
const monthIdx=ym=>{const p=ym.split('-').map(Number);return p[0]*12+p[1]-1};
function monthInfo(ym){
  const pp=ym.split('-').map(Number),dim=new Date(pp[0],pp[1],0).getDate();
  let w=0,r=0,f=0,run=0,best=0;
  for(let d=1;d<=dim;d++){
    const ty=dayType(ym+'-'+pad(d));
    if(ty.food)f++;
    if(ty.work){w++;run++;if(run>best)best=run}
    else if(ty.rest)r++;
    else run=0;
  }
  return {w:w,r:r,f:f,best:best,dim:dim};
}

function applyField(el){
  const f=el.dataset.f,k=S.date,d=S.days[k];
  if(el.dataset.c){
    const c=d&&d.cardio&&d.cardio.find(x=>x.id===el.dataset.cid);
    if(!c)return false;
    const cf=el.dataset.c,cv=el.value===''?'':Number(el.value);
    if(c[cf]!==cv){c[cf]=cv;persist(k);return true}
    return false;
  }
  if(f==='label'){
    const v=el.value.trim(),cur=d?d.workout.label:'';
    if(v!==cur){ensureDay(k).workout.label=v;persist(k);return true}
    return false;
  }
  if(!d)return false;
  const ex=d.workout.exercises.find(e=>e.id===el.dataset.ex);
  const s=ex&&ex.sets[+el.dataset.i];
  if(!s)return false;
  const v=el.value===''?'':Number(el.value);
  if(s[f]!==v){s[f]=v;persist(k);return true}
  return false;
}

async function saveFile(name,blob){

  const WDN=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const ml={};MEALS.forEach(m=>{ml[m[0]]=m[1]});
  const summary=[['วันที่','วัน','แคลอรี่รวม (kcal)','เป้าหมาย (kcal)','โปรตีนรวม (g)','เวิร์คเอาท์','ชื่อวันฝึก','น้ำหนัก (กก.)','ไขมัน (%)','กล้ามเนื้อ (กก.)','คาร์ดิโอ (นาที)','คาร์ดิโอ เผาผลาญ (kcal)','ภาระการฝึก (คะแนน)','ประเมิน']];
  const food=[['วันที่','มื้อ','อาหาร','แคลอรี่ (kcal)','โปรตีน (g)']];
  const work=[['วันที่','ชื่อวันฝึก','ท่า','ประเภทเซ็ต','น้ำหนัก (กก.)','ครั้ง','Volume (กก.)','ทำเสร็จ']];
  const body=[['วันที่','น้ำหนัก (กก.)','ไขมัน (%)','มวลไขมัน (กก.)','กล้ามเนื้อ (กก.)']];
  const cardio=[['วันที่','เครื่อง/ประเภท','เวลา (นาที)','ความเร็ว (กม./ชม.)','ความชัน (%)','ระดับ/แรงต้าน','ระยะทาง (กม.)','แคลอรี่ที่เผาผลาญ (kcal)','ชีพจรเฉลี่ย (bpm)','ชีพจรสูงสุด (bpm)']];
  const nv=v=>(v===''||v==null)?'':v;
  const ctx=makeCtx();
  keys.forEach(k=>{
    const d=S.days[k];
    const has=d&&d.meals.length;

    summary.push([k,WDN[fromKey(k).getDay()],has?Math.round(sum(d.meals,'kcal')):'',S.goal,has?Math.round(sum(d.meals,'p')):'',d&&isWorkoutDay(d)?'ออกกำลังกาย':(d&&isRest(d)?'วันพัก':''),d?d.workout.label:'',d&&d.weight?d.weight:'',d&&d.fat?d.fat:'',d&&d.muscle?d.muscle:'',d&&cardioTotals(d).min?cardioTotals(d).min:'',d&&cardioTotals(d).kcal?cardioTotals(d).kcal:'',ev?Math.round(ev.L.total):'',ev?LV[ev.lv].t:'']);
    if(!d)return;
    d.meals.forEach(m=>food.push([k,ml[m.meal]||'',m.name,Number(m.kcal)||0,Number(m.p)||'']));
    d.workout.exercises.forEach(e=>{
      let n=0;
      e.sets.forEach(s=>{
        if(!(validSet(s)||Number(s.w)>0))return;
        const warm=isWarm(s);

      });
    });

    if(d.weight||d.fat||d.muscle){
      const fk=Number(d.weight)>0&&Number(d.fat)>0?Math.round(Number(d.weight)*Number(d.fat))/100:'';

    if(cardio.length>1)add('คาร์ดิโอ',cardio,[12,34,12,16,12,12,14,22,16,16]);

  }
}

  savegoal(){
    const v=parseInt($('#gl').value,10);
    if(!(v>=500)){$('#ferr').textContent='ใส่ตัวเลขตั้งแต่ 500 ขึ้นไป';return}
    S.goal=v;persistSettings();S.sheet=null;renderSheet();render();
  },
  closesheet(){S.sheet=null;renderSheet();render()},
  openfood(el){S.sheet={type:'food',meal:el.dataset.m||guessMeal()};renderSheet()},
  editfood(el){
    const m=getDay(S.date).meals.find(x=>x.id===el.dataset.id);
    if(m){S.sheet={type:'food',id:m.id,meal:m.meal};renderSheet()}
  },
  sheetmeal(el){
    S.sheet.meal=el.dataset.m;
    document.querySelectorAll('#mealchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===S.sheet.meal));
  },
  recent(el){$('#fn').value=el.dataset.n;$('#fk').value=el.dataset.k;$('#fp').value=el.dataset.p},
  savefood(){
    const name=$('#fn').value.trim(),kcal=parseFloat($('#fk').value),p=parseFloat($('#fp').value);
    if(!(kcal>=0)){$('#ferr').textContent='ใส่แคลอรี่เป็นตัวเลข';return}
    const d=ensureDay(S.date),sh=S.sheet;
    const m=sh.id&&d.meals.find(x=>x.id===sh.id);
    if(m){m.name=name||m.name||'อาหาร';m.kcal=kcal;m.p=isNaN(p)?0:p;m.meal=sh.meal}
    else d.meals.push({id:uid8(),name:name||'อาหาร',kcal:kcal,p:isNaN(p)?0:p,meal:sh.meal});
    persist(S.date);S.sheet=null;renderSheet();render();
    toast(m?'บันทึกการแก้ไขแล้ว ✓':'บันทึกอาหารแล้ว ✓');
  },
  delfood(el){
    if(!twoTap('food',el,'ลบรายการนี้'))return;
    armed=null;
    const d=S.days[S.date];
    d.meals=d.meals.filter(x=>x.id!==S.sheet.id);
    persist(S.date);S.sheet=null;renderSheet();render();
  },

  setlabel(el){
    const d=ensureDay(S.date),l=el.dataset.l;
    d.workout.label=d.workout.label.toLowerCase()===l.toLowerCase()?'':l;
    persist(S.date);render();
  },
  copyprev(el){
    const src=S.days[el.dataset.d];if(!src)return;
    const d=ensureDay(S.date);
    d.workout.exercises=src.workout.exercises.map(e=>({id:uid8(),name:e.name,sets:e.sets.filter(validSet).map(x=>({w:'',r:'',done:false,t:x.t||''}))}));
    d.workout.exercises.forEach(e=>{if(!e.sets.length)e.sets.push({w:'',r:'',done:false})});
    persist(S.date);render();
  },
  addex(){
    const inp=$('#exn'),name=inp.value.trim();
    if(!name){inp.focus();return}
    if(!addExercise(name))toast('มีท่านี้อยู่แล้ววันนี้');
    render();
  },
  openlib(){S.sheet={type:'lib',q:'',g:'all',e:'all'};renderSheet();setTimeout(()=>{const i=$('#lq');if(i&&window.matchMedia('(min-width:720px)').matches)i.focus()},60)},
  libg(el){
    S.sheet.g=el.dataset.g;
    document.querySelectorAll('#gchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.g===S.sheet.g));
    renderLibResults();
  },
  libe(el){
    S.sheet.e=el.dataset.e;
    document.querySelectorAll('#echips .chip').forEach(c=>c.classList.toggle('on',c.dataset.e===S.sheet.e));
    renderLibResults();
  },
  pickex(el){
    if(addExercise(el.dataset.n)){render();toast('เพิ่ม '+el.dataset.n+' แล้ว')}
    renderLibResults();
  },
  addcustom(el){
    if(addExercise(el.dataset.n)){render();toast('เพิ่ม '+el.dataset.n+' แล้ว')}
    renderLibResults();
  },
  addset(el){
    const e=findEx(el.dataset.ex);if(!e)return;
    const work=e.sets.filter(x=>!isWarm(x));
    const last=work.length?work[work.length-1]:(e.sets[e.sets.length-1]||{w:'',r:''});
    e.sets.push({w:last.w,r:last.r,done:false,t:''});
    persist(S.date);render();
  },
  delset(el){
    const e=findEx(el.dataset.ex);if(!e)return;
    e.sets.splice(+el.dataset.i,1);
    persist(S.date);render();
  },
  done(el){
    const e=findEx(el.dataset.ex);const s=e&&e.sets[+el.dataset.i];if(!s)return;
    s.done=!s.done;persist(S.date);render();
  },
  delex(el){
    if(!twoTap('ex'+el.dataset.ex,el,'ลบท่า'))return;
    armed=null;
    const d=S.days[S.date];
    d.workout.exercises=d.workout.exercises.filter(e=>e.id!==el.dataset.ex);
    persist(S.date);render();
  },

  saveweight(){
    const rd=id=>{const v=$(id).value.trim();return v===''?null:parseFloat(v)};
    const w=rd('#wkg'),f=rd('#wfat'),m=rd('#wmus');
    if(w===null&&f===null&&m===null){toast('ใส่ค่าอย่างน้อย 1 ช่อง');return}
    if(w!==null&&!(w>20&&w<500)){toast('น้ำหนักควรอยู่ระหว่าง 20–500 กก.');return}
    if(f!==null&&!(f>=2&&f<=70)){toast('ไขมันควรอยู่ระหว่าง 2–70 %');return}
    if(m!==null&&!(m>=5&&m<=150)){toast('กล้ามเนื้อควรอยู่ระหว่าง 5–150 กก.');return}
    const d=ensureDay(S.date);
    delete d.weight;delete d.fat;delete d.muscle;
    if(w!==null)d.weight=Math.round(w*10)/10;
    if(f!==null)d.fat=Math.round(f*10)/10;
    if(m!==null)d.muscle=Math.round(m*10)/10;
    persist(S.date);render();toast('บันทึกข้อมูลร่างกายแล้ว');
  },
  clearweight(){
    const d=S.days[S.date];if(!d)return;
    delete d.weight;delete d.fat;delete d.muscle;persist(S.date);render();
  },

  setsex(el){S.profile.sex=el.dataset.v;persistSettings();render()},
  plan(el){S.profile.plan=el.dataset.v;persistSettings();updateTdee()},
  usegoal(el){
    S.goal=parseInt(el.dataset.v,10);persistSettings();updateTdee();
    toast('ตั้งเป้าหมายแคลอรี่ '+fmt(S.goal)+' kcal แล้ว');
  },
  exportreport(){exportReport()},
  togwarm(el){
    const e=findEx(el.dataset.ex);const s=e&&e.sets[+el.dataset.i];if(!s)return;
    s.t=isWarm(s)?'':'w';persist(S.date);render();
  },
  histr(el){S.hr=el.dataset.v;render()},
  calnav(el){
    const pp=S.calM.split('-').map(Number);
    const d=new Date(pp[0],pp[1]-1+Number(el.dataset.n),1);
    const ym=d.getFullYear()+'-'+pad(d.getMonth()+1);
    if(Math.abs(monthIdx(ym)-monthIdx(todayKey().slice(0,7)))>12)return;
    S.calM=ym;render();
  },
  calm(el){S.calM=el.dataset.m;render()},
  caltoday(){S.calM=todayKey().slice(0,7);render()},
  calday(el){S.sheet={type:'cal',k:el.dataset.d};renderSheet()},
  torest(el){
    const k=el.dataset.d,d=ensureDay(k);
    const was=d.workout.label==='พัก';
    if(was)d.workout.label='';
    else if(!isWorkoutDay(d))d.workout.label='พัก';
    persist(k);S.sheet=null;renderSheet();render();
    toast(was?'ยกเลิกวันพักแล้ว':'ทำเครื่องหมายวันพักแล้ว');
  },
  async saveworkout(el){
    const k=S.date,d=getDay(k);
    if(!(d.workout.label||d.workout.exercises.length||(d.cardio&&d.cardio.length))){toast('ยังไม่มีข้อมูลเวิร์คเอาท์ให้บันทึก');return}
    const txt=el.textContent;
    el.disabled=true;el.textContent='กำลังบันทึก…';
    persist(k);
    const t0=Date.now();
    while(pending.has(k)&&Date.now()-t0<8000)await new Promise(r=>setTimeout(r,100));
    el.disabled=false;el.textContent=txt;
    if(failed.has(k))toast('บันทึกขึ้นระบบไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้ ลองกดบันทึกอีกครั้ง');
    else if(pending.has(k))toast('ยังบันทึกไม่เสร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่');
    else toast('บันทึกเวิร์คเอาท์แล้ว ✓');
  },
  wmetric(el){S.wm=el.dataset.v;render()},
  pickprog(el){S.pex=el.dataset.n;render()},
  addcardio(el){
    const d=ensureDay(S.date);
    if(!d.cardio)d.cardio=[];
    const id=uid8();
    d.cardio.push({id:id,type:el.dataset.t,min:'',speed:'',incline:'',level:'',dist:'',kcal:'',hr:'',hrmax:''});
    persist(S.date);render();
    setTimeout(()=>{const c=document.querySelector('[data-cardio="'+id+'"]');if(c){c.scrollIntoView({block:'center'});const i=c.querySelector('input');if(i)i.focus()}},50);
  },
  delcardio(el){
    if(!twoTap('c'+el.dataset.cid,el,'ลบ'))return;
    armed=null;
    const d=S.days[S.date];if(!d||!d.cardio)return;
    d.cardio=d.cardio.filter(c=>c.id!==el.dataset.cid);
    persist(S.date);render();
  },
  reprange(el){
    S.rep.p=el.dataset.v;
    if(S.rep.p==='custom'&&!S.rep.from){S.rep.from=addDays(todayKey(),-6);S.rep.to=todayKey()}
    render();
  },
  authtab(el){S.authTab=el.dataset.t;render()},
  async login(){
    const phone=$('#aphone').value.trim(),pin=$('#apin').value;
    if(!/^0\d{9}$/.test(phone)){authErr('ใส่เบอร์โทร 10 หลัก เช่น 0812345678');return}
    if(!/^\d{6}$/.test(pin)){authErr('PIN ต้องเป็นตัวเลข 6 หลัก');return}
    authErr('');authBusy(true);
    try{
      const r=await sb.auth.signInWithPassword({email:emailOf(phone),password:pin});
      if(r.error)authErr(/invalid login/i.test(r.error.message)?'เบอร์โทรหรือ PIN ไม่ถูกต้อง':/rate|too many/i.test(r.error.message)?'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่':'เข้าสู่ระบบไม่สำเร็จ: '+r.error.message);
    }catch(e){authErr('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
    authBusy(false);
  },
  async register(){
    const name=$('#aname').value.trim(),phone=$('#aphone').value.trim(),pin=$('#apin').value,pin2=$('#apin2').value;
    if(!name){authErr('ใส่ชื่อ');return}
    if(!/^0\d{9}$/.test(phone)){authErr('ใส่เบอร์โทร 10 หลัก เช่น 0812345678');return}
    if(!/^\d{6}$/.test(pin)){authErr('PIN ต้องเป็นตัวเลข 6 หลัก');return}
    if(pin!==pin2){authErr('PIN สองช่องไม่ตรงกัน');return}
    authErr('');authBusy(true);
    try{
      const r=await sb.auth.signUp({email:emailOf(phone),password:pin,options:{data:{name:name,phone:phone}}});
      if(r.error){
        authErr(/already|registered/i.test(r.error.message)?'เบอร์นี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน':/rate|too many/i.test(r.error.message)?'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่':'สมัครไม่สำเร็จ: '+r.error.message);
      }else if(r.data&&r.data.user&&r.data.user.identities&&!r.data.user.identities.length){
        authErr('เบอร์นี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน');
      }else if(!r.data||!r.data.session){
        authErr('สมัครแล้วแต่ยังเข้าระบบไม่ได้ ผู้ดูแลต้องปิด Confirm email ใน Supabase ก่อน');
      }
    }catch(e){authErr('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
    authBusy(false);
  },
  async logout(){
    try{await sb.auth.signOut()}catch(e){toast('ออกจากระบบไม่สำเร็จ ลองใหม่อีกครั้ง')}
  },
  async changepin(){
    const v=$('#npin').value;
    if(!/^\d{6}$/.test(v)){toast('PIN ต้องเป็นตัวเลข 6 หลัก');return}
    try{
      const r=await sb.auth.updateUser({password:v});
      if(r.error)toast('เปลี่ยน PIN ไม่สำเร็จ: '+r.error.message);
      else{$('#npin').value='';toast('เปลี่ยน PIN แล้ว')}
    }catch(e){toast('เปลี่ยน PIN ไม่สำเร็จ ตรวจอินเทอร์เน็ต')}
  }
};

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el||el.dataset.act==='pick')return;
  const h=ACT[el.dataset.act];
  if(!h)return;
  if(el.dataset.act!=='delex'&&el.dataset.act!=='delfood'&&el.dataset.act!=='delcardio')armed=null;
  commitAll();
  h(el,ev);
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='aphone'||el.id==='apin'||el.id==='apin2'||el.id==='npin'){const v=el.value.replace(/\D/g,'');if(v!==el.value)el.value=v;return}
  if(el.id==='lq'&&S.sheet&&S.sheet.type==='lib'){S.sheet.q=el.value;renderLibResults();return}
  if(el.dataset&&el.dataset.p)setP(el);
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.r){S.rep[el.dataset.r]=el.value;requestRender();return}
  if(el.dataset&&el.dataset.act==='pick'){
    if(el.value){S.date=el.value;render()}
    return;
  }
  if(el.dataset&&el.dataset.p){
    setP(el);persistSettings();
    if(el.dataset.p==='startW'||el.dataset.p==='targetW')requestRender();
    return;
  }
  if(el.dataset&&(el.dataset.f||el.dataset.c)){
    if(applyField(el)){
      const s=$('#wsum');if(s)s.innerHTML=summaryText(getDay(S.date));
      const cs=$('#csum');if(cs)cs.innerHTML=cardioSummary(getDay(S.date));
      refreshEval();
      if(el.dataset.f==='label')requestRender();
    }
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  const id=ev.target.id;
  if(id==='aname'||id==='aphone'||id==='apin'||id==='apin2'){ev.preventDefault();if(S.authTab==='register')ACT.register();else ACT.login();return}
  if(id==='npin'){ev.preventDefault();ACT.changepin();return}
  if(id==='exn'){ev.preventDefault();ACT.addex()}
  else if(id==='fn'||id==='fk'||id==='fp'){ev.preventDefault();ACT.savefood()}
  else if(id==='gl'){ev.preventDefault();ACT.savegoal()}
  else if(id==='wkg'||id==='wfat'||id==='wmus'){ev.preventDefault();ACT.saveweight()}
  else if(id==='wl'){ev.target.blur()}
});

/* ---------- start ---------- */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&S.mode==='cloud'&&Date.now()-lastLoad>20000)loadCloud().catch(()=>{});
});
if(CONFIGURED){initAuth()}
else{S.auth='local';loadLocal()}
render();
if(!CONFIGURED&&SUPABASE_URL.indexOf('YOUR')<0&&SUPABASE_ANON_KEY.indexOf('YOUR')<0){
  setTimeout(()=>toast(window.supabase?'ค่า Supabase ไม่ถูกต้อง ตรวจ Project URL (https://xxxx.supabase.co) และคีย์อีกครั้ง':'โหลดไลบรารี Supabase ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า'),700);
}
})();
</script>
</body>
</html>
